name: Import source files
on:
  push:
    paths:
      - '.github/workflows/import-project.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original files
        run: |
          git clone --depth 1 https://github.com/Rivka387/meeting-notes-ai.git /tmp/source
          rsync -a --exclude='.git' /tmp/source/ ./
      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copy source project" || exit 0
          git push
