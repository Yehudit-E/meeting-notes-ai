name: Import original project
on:
  push:
    paths:
      - '.github/workflows/import-project.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original source
        run: |
          git clone --depth 1 https://github.com/Rivka387/meeting-notes-ai.git /tmp/original
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/original/. ./
          rm -rf .git
      - name: Commit exact source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import project files from Rivka387/meeting-notes-ai" || exit 0
          git push
